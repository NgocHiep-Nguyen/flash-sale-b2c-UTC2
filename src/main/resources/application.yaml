# ===================================================================
# Flash Sale B2C - Base Application Configuration
# File cấu hình chung, an toàn để lưu trữ và đẩy lên GitHub
# ===================================================================

spring:
  application:
    name: flash-sale-b2c-UTC2
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # --- JPA & Hibernate Cấu hình chung ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
          order_inserts: true
          order_updates: true

  # --- Flyway Migration Cấu hình chung ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  # --- Jackson Serialization Cấu hình chung ---
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# --- Server Web & Cổng dịch vụ ---
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
  servlet:
    encoding:
      charset: UTF-8
      force: true

# --- Swagger / OpenAPI Documentation ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# --- Định dạng Log mặc định ---
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# --- Cấu hình JWT (JSON Web Token) ---
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 giờ
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngày


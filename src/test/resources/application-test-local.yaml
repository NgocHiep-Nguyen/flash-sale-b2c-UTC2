# Profile test-local: Dùng PostgreSQL và Redis thật trên máy phát triển
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/flash_sale_test
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: SecureTestLocalSecretWithAtLeast32CharactersHS256Bit2026
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

logging:
  level:
    com.b2c.flash_sale_b2c_UTC2: DEBUG
